name: Release Ckit

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ckit-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate release
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'Run releases from the default branch: %s\n' "$DEFAULT_BRANCH" >&2
            exit 1
          fi
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Version must use X.Y.Z, for example 0.1.0.\n' >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            printf 'Tag v%s already exists. Choose a new version.\n' "$version" >&2
            exit 1
          fi
          printf 'version=%s\ntag=v%s\n' "$version" "$version" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      - name: Validate update signing secret
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            printf 'Set the SPARKLE_PRIVATE_KEY repository secret before publishing updates. See Docs/Releasing.md.\n' >&2
            exit 1
          fi

      - name: Run core tests
        run: swift test --scratch-path .build/tests

      - name: Check native menu and creation form
        run: |
          mkdir -p .build Design
          swiftc -parse-as-library CKit/Core/*.swift CKit/Interface/*.swift CKit/ContainerMenuController.swift Scripts/CheckNativeMenu.swift -o .build/check-native-menu
          .build/check-native-menu
          swiftc -parse-as-library CKit/Core/*.swift CKit/Interface/*.swift Scripts/CheckCreationWindow.swift -o .build/check-creation-window
          .build/check-creation-window

      - name: Package app and DMG
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash Scripts/PackageRelease.sh "$RELEASE_VERSION" "$GITHUB_RUN_NUMBER"

      - name: Check update controls and relaunch safety
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash Scripts/CheckUpdates.sh "dist/releases/v$RELEASE_VERSION/Ckit.app"

      - name: Generate signed update feed
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash Scripts/GenerateAppcast.sh "$RELEASE_VERSION" "dist/releases/v$RELEASE_VERSION"

      - name: Tag and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          output="dist/releases/$RELEASE_TAG"
          asset="Ckit-$RELEASE_VERSION-arm64"
          cat > "$output/release-notes.md" <<NOTES
          Ckit $RELEASE_VERSION for Apple Silicon Macs running macOS 26 or later.

          Open the DMG and drag Ckit to Applications, or unzip the app and move it there. Apple’s container CLI must be installed separately.

          This build uses ad hoc signing and is not notarized. If macOS blocks a downloaded copy, use System Settings → Privacy & Security → Open Anyway for a build you trust.

          Source commit: $GITHUB_SHA
          NOTES
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Ckit $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "$output/$asset.dmg" "$output/$asset.zip" "$output/SHA256SUMS.txt" "$output/appcast.xml" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Ckit $RELEASE_TAG" --notes-file "$output/release-notes.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
